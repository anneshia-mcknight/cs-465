

  <div class="container mt-4">
  <h2>Add New Trip</h2>

  <form (ngSubmit)="onSubmit()"> 

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input type="text" name="code" class="form-control"
             [(ngModel)]="trip.code" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input type="text" name="name" class="form-control"
             [(ngModel)]="trip.name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Duration</label>
      <input type="text" name="length" class="form-control"
             [(ngModel)]="trip.length" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" name="start" class="form-control"
             [(ngModel)]="trip.start" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" name="resort" class="form-control"
             [(ngModel)]="trip.resort" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="number" name="perPerson" class="form-control"
             [(ngModel)]="trip.perPerson" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input type="text" name="image" class="form-control"
             [(ngModel)]="trip.image" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control"
                [(ngModel)]="trip.description" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Add Trip
    </button>
  </form>
</div>
