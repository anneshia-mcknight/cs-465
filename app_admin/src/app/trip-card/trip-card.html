
<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">
      Duration: {{ trip.length }}
    </p>

    <p class="card-text">
      Resort: {{ trip.resort }}
    </p>

    <p class="card-text">
      Price per person: ${{ trip.perPerson }}
    </p>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <button
      type="button"
      class="btn btn-primary"
      (click)="onEdit()">
      Edit Trip
    </button>
  </div>
</div>
