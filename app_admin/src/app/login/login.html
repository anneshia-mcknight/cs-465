<div class="container mt-4">
  <h2>Login</h2>

  <form (ngSubmit)="onSubmit()" class="mt-3">
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input
        id="email"
        type="email"
        name="email"
        class="form-control"
        [(ngModel)]="email"
        required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        class="form-control"
        [(ngModel)]="password"
        required>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="loading">
      {{ loading ? 'Signing In...' : 'Sign In' }}
    </button>
  </form><p class="mt-3">New administrator? <a routerLink="/register">Create an account</a></p>
</div>
